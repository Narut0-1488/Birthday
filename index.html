<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Полина · Магнитола с пионами · 17 лет</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ФОНОВЫЕ ИЗОБРАЖЕНИЯ (день/ночь) -->
    <div class="scene-container">
      <img id="dayImg" class="day-img" src="img/day.jpg" alt="День" />
      <img id="nightImg" class="night-img" src="img/night.jpg" alt="Ночь" />
    </div>

    <!-- ЗИП-ПАКЕТ (поверх магнитолы) -->
    <div class="hero" id="heroScreen">
      <div class="zippacket" id="zippacket">
        <div class="zip-top-bar">
          <div class="zip-slider left-slider" id="leftSlider"></div>
          <div class="zip-slider right-slider" id="rightSlider"></div>
        </div>
        <div class="zip-body">
          <div class="zip-text">🎁 Открыть подарок 🎁</div>
        </div>
      </div>
    </div>

    <!-- МАГНИТОЛА -->
    <div class="boombox" id="boombox">
      <div class="vinyl-section" id="vinylTouchZone">
        <canvas id="peonyCanvas" width="400" height="400"></canvas>
      </div>
      <div class="track-info">
        <span class="track-name" id="trackName"
          >🎂 С днём рождения, Полина!</span
        >
      </div>
      <div class="control-buttons">
        <button class="ctrl" id="prevBtn">⏮️</button>
        <button class="ctrl" id="playPauseBtn">⏸️</button>
        <button class="ctrl" id="nextBtn">⏭️</button>
      </div>
      <div class="volume-area">
        <span class="volume-icon">🔊</span>
        <input
          type="range"
          id="volumeSlider"
          min="0"
          max="1"
          step="0.02"
          value="0.7"
        />
      </div>
    </div>

    <script src="js/canvas.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
